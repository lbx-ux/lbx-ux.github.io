name: Deploy to GitHub Pages

# ── 部署已冻结（2026-10-10）──
# 线上站点停留在冻结时的内容，仓库代码照常 push 备份。
# 恢复自动部署：把 push 触发加回来即可（其余无需改动）。
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

# 新推送自动取消还在跑的旧部署，避免排队阻塞
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # 构建前生成默认 OG 分享图（sharp 渲染 SVG → PNG）
      - name: Generate default OG image
        run: npm run og

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # 换成自定义域名后：取消注释 cname 并填你的域名，
        # 同时把 astro.config.mjs 的 SITE 改为 https://<你的域名>
        # cname: www.example.com

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>发布后台 · lbx's Blog</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/></svg>" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <header class="topbar glass">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>lbx's Blog 发布后台</h1>
    </div>
    <div class="topbar-actions">
      <span id="vault-path" class="vault-path" title="Obsidian 库位置"></span>
      <button id="btn-deploy" class="deploy-btn" title="提交并推送到 GitHub（自动部署上线）">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
        推送上线
      </button>
      <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" title="切换主题" aria-label="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- 左栏：Obsidian 库 -->
    <section class="panel glass" aria-label="Obsidian 笔记库">
      <div class="panel-head">
        <h2>笔记库</h2>
        <input id="search" type="search" placeholder="搜索笔记…" aria-label="搜索笔记" />
      </div>
      <div id="note-list" class="note-list" role="list"></div>
    </section>

    <!-- 右栏：已发布管理 -->
    <section class="panel glass" aria-label="已发布文章">
      <div class="panel-head">
        <h2>已发布 <span id="post-count" class="count-badge"></span></h2>
        <button id="btn-refresh-posts" class="ghost-btn">刷新</button>
      </div>
      <div id="post-list" class="post-list" role="list"></div>
    </section>
  </main>

  <!-- 预览 / 发布弹窗 -->
  <dialog id="preview-dialog" class="glass dialog">
    <div class="dialog-head">
      <h3 id="preview-title">预览</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <div class="meta-form">
        <label>标题 <input id="f-title" type="text" /></label>
        <label>描述 <input id="f-desc" type="text" placeholder="留空自动提取首段" /></label>
        <div class="meta-row">
          <label>日期 <input id="f-date" type="date" /></label>
        </div>
        <div class="meta-row">
          <label>专栏 <input id="f-series" type="text" placeholder="留空按目录自动推导" /></label>
          <label>专栏序号 <input id="f-order" type="text" placeholder="留空自动推导" /></label>
        </div>
        <label class="draft-check">
          <input id="f-draft" type="checkbox" /> 存为草稿（构建时不会公开）
        </label>
      </div>
      <pre id="preview-content" class="preview-content" tabindex="0"></pre>
    </div>
    <div class="dialog-foot">
      <span id="publish-status" class="publish-status" role="status"></span>
      <button id="btn-publish" class="primary-btn">发布</button>
    </div>
  </dialog>

  <!-- 设置弹窗 -->
  <dialog id="settings-dialog" class="glass dialog dialog-sm">
    <div class="dialog-head">
      <h3>设置</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <label>Obsidian 库路径 <input id="s-vault" type="text" spellcheck="false" /></label>
      <p class="hint">修改后点击保存，笔记列表会重新加载。</p>
    </div>
    <div class="dialog-foot">
      <span id="settings-status" class="publish-status"></span>
      <button id="btn-save-settings" class="primary-btn">保存</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>

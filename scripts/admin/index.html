<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>发布后台 · lbx's Blog</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/></svg>" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <header class="topbar glass">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>lbx's Blog 发布后台</h1>
    </div>
    <div class="topbar-actions">
      <button id="btn-theme" class="icon-btn" title="切换主题" aria-label="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- 左栏：上传笔记 -->
    <section class="panel glass" aria-label="上传笔记">
      <div class="panel-head">
        <h2>上传笔记</h2>
        <input id="search" type="search" placeholder="过滤已选文件…" aria-label="过滤已选文件" />
      </div>
      <div id="drop-zone" class="drop-zone" tabindex="0" role="button"
           aria-label="拖拽或点击选择文件"
           title="支持 .md 笔记与图片；选文件夹可保留目录结构用于专栏自动推导">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
        <p class="dz-main">拖拽笔记 / 图片到此处，或点击选择</p>
        <p class="dz-sub">选中文件夹可保留目录结构，专栏与序号自动推导</p>
      </div>
      <input id="file-input" type="file" multiple accept=".md,.markdown,image/*" hidden />
      <input id="folder-input" type="file" multiple webkitdirectory hidden />
      <div class="pick-row">
        <button id="btn-pick-files" class="ghost-btn">选择文件</button>
        <button id="btn-pick-folder" class="ghost-btn">选择文件夹</button>
        <span id="picked-stats" class="picked-stats"></span>
        <button id="btn-clear-picked" class="ghost-btn" hidden>清空</button>
      </div>
      <div id="note-list" class="note-list" role="list"></div>
    </section>

    <!-- 右栏：已发布管理 -->
    <section class="panel glass" aria-label="已发布文章">
      <div class="panel-head">
        <h2>已发布 <span id="post-count" class="count-badge"></span></h2>
        <button id="btn-refresh-posts" class="ghost-btn">刷新</button>
      </div>
      <div id="post-list" class="post-list" role="list"></div>
    </section>
  </main>

  <!-- 预览 / 发布弹窗 -->
  <dialog id="preview-dialog" class="glass dialog">
    <div class="dialog-head">
      <h3 id="preview-title">预览</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <p id="private-hint" class="private-hint" hidden>
        ⚠ 该笔记位于私密目录（实习 / 简历 / 日常），确认要公开发布吗？
      </p>
      <div class="meta-form">
        <label>标题 <input id="f-title" type="text" /></label>
        <label>描述 <input id="f-desc" type="text" placeholder="留空自动提取首段" /></label>
        <div class="meta-row">
          <label>专栏 <input id="f-series" type="text" placeholder="留空按目录自动推导" /></label>
          <label>专栏序号 <input id="f-order" type="text" placeholder="留空自动推导" /></label>
        </div>
        <label class="draft-check">
          <input id="f-draft" type="checkbox" /> 存为草稿（构建时不会公开）
        </label>
        <p class="hint">发布后进入对应专栏分组的末尾，顺序可在右侧「已发布」里拖动调整。</p>
      </div>
      <pre id="preview-content" class="preview-content" tabindex="0"></pre>
      <textarea id="edit-content" class="preview-content edit-area" spellcheck="false" hidden></textarea>
    </div>
    <div class="dialog-foot">
      <span id="publish-status" class="publish-status" role="status"></span>
      <button id="btn-publish" class="primary-btn">发布</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
